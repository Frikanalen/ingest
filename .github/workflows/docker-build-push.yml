name: Ingest docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release PR or GitHub Release (main only)
        id: release
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: googleapis/release-please-action@v5
        with:
          release-type: python

  archive-utils:
    name: Attach fk-archive-utils to the release
    needs: release
    # Only on a release commit, and only on main: the .deb's version is the
    # release tag, so there is nothing to name it after otherwise. Branch
    # builds of the package are covered by .github/workflows/archive-utils.yml.
    if: ${{ github.ref == 'refs/heads/main' && needs.release.outputs.created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Built inside trixie because that is what file01 runs: the package's
      # ${python3:Depends} has to name a python3 Debian actually has. Done with
      # `docker run` rather than a `container:` job so the gh CLI the upload
      # needs is still the runner's.
      - name: Build the Debian package
        run: |
          docker run --rm -v "$PWD/archive-utils:/src" -w /src debian:trixie bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              build-essential debhelper dh-python pybuild-plugin-pyproject \
              python3-all python3-setuptools
            ./build-deb.sh "${{ needs.release.outputs.tag }}"
          '

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" archive-utils/dist/*.deb --clobber

  build:
    name: Build and push Docker image to GHCR
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned to an exact tag on purpose: setup-uv stopped publishing the
      # floating `v10`/`v10.0` tags in v8, so a major-only ref does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Generate API client
        run: ./scripts/generate-client.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/frikanalen/ingest
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.release.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' && needs.release.outputs.created == 'true' }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and (if not PR) push
        uses: docker/build-push-action@v7
        with:
          # Use the checkout so the generated, gitignored API client is included
          # in the build context.
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
