name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the run in flight irrelevant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest and ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The runner image does not ship ffmpeg, and the suite shells out to
      # ffmpeg/ffprobe to build its fixture videos and to probe them. These are
      # the same pinned binaries the Dockerfile puts in the image, rather than
      # whatever apt has, so the tests exercise the encoder production runs.
      # The image is scratch, so the binaries come out of a stopped container
      # rather than by running one.
      - name: Install ffmpeg
        run: |
          cid=$(docker create mwader/static-ffmpeg:9.0.1)
          docker cp "$cid:/ffmpeg" /usr/local/bin/ffmpeg
          docker cp "$cid:/ffprobe" /usr/local/bin/ffprobe
          docker rm "$cid"
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # Pinned to an exact tag on purpose: setup-uv stopped publishing the
      # floating `v10`/`v10.0` tags in v8, so a major-only ref does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # tests/conftest.py imports frikanalen_django_api_client at module level.
      # The client is generated from the committed schema and is gitignored, so
      # without this step collection fails before a single test runs.
      - name: Generate API client
        run: ./scripts/generate-client.sh

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check
