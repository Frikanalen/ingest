name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the run in flight irrelevant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest and ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The runner image does not ship ffmpeg, and the suite shells out to
      # ffmpeg/ffprobe to build its fixture videos, to probe them, and to run
      # the CPU encoder's self-test for real. This is the same jellyfin-ffmpeg
      # release the Dockerfile copies into the image, built for the runner's
      # Ubuntu rather than the image's Debian, so the tests exercise the
      # encoder production runs. Bump the two together.
      - name: Install ffmpeg
        run: |
          . /etc/os-release
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://repo.jellyfin.org/jellyfin_team.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/jellyfin.gpg
          echo "deb [signed-by=/etc/apt/keyrings/jellyfin.gpg] https://repo.jellyfin.org/ubuntu $VERSION_CODENAME main" \
            | sudo tee /etc/apt/sources.list.d/jellyfin.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends "jellyfin-ffmpeg8=8.1.2-4-$VERSION_CODENAME"
          sudo ln -sf /usr/lib/jellyfin-ffmpeg/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /usr/lib/jellyfin-ffmpeg/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # Pinned to an exact tag on purpose: setup-uv stopped publishing the
      # floating `v10`/`v10.0` tags in v8, so a major-only ref does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # tests/conftest.py imports frikanalen_django_api_client at module level.
      # The client is generated from the committed schema and is gitignored, so
      # without this step collection fails before a single test runs.
      - name: Generate API client
        run: ./scripts/generate-client.sh

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check
