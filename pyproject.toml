[project]
name = "ingest"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.21.0",
    "attrs>=22.2.0",
    "fastapi[standard]>=0.116.1",
    "httpx>=0.28.1",
    "inotify>=0.2.10",
    "pathvalidate>=3.3.1",
    "pillow>=11.1.0",
    "pydantic-settings>=2.10.1",
    "requests>=2.32.4",
    "uvicorn>=0.35.0",
    "watchdog>=6.0.0",
    "werkzeug>=3.1.3",
]

[dependency-groups]
dev = [
    "anyio>=4.9.0",
    "black>=25.1.0",
    "click>=8.2.1",
    "datamodel-code-generator>=0.31.1",
    "openapi-python-client>=0.29.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-httpserver>=1.1.3",
    "ruff>=0.12.3",
    "tuspy>=1.1.0",
]

[tool.ruff]
line-length = 120
# `archive-utils/src` is the storage host's package, which the test SSH server
# runs so that the two halves of the archive protocol are checked against each
# other rather than against a double.
src = [".", "archive-utils/src"]
# Generated code files. These are committed, but they are the output of
# scripts/generate-hook-types.sh, so any lint fixed here is undone by the next
# regeneration. Both previous entries named paths that no longer exist; these
# are where datamodel-codegen actually writes today.
exclude = [
    "app/api/hooks/schema/request.py",
    "app/api/hooks/schema/response.py",
    "app/media/ffprobe_schema.py",
]
[tool.ruff.lint]
extend-select = [
    "I",     # isort: import sorting
    "F",     # pyflakes: undefined names, unused imports
    "E",     # pycodestyle: basic style issues
    "W",     # pycodestyle: warnings
    "C90",   # mccabe: complexity
    "UP",    # pyupgrade: suggest modern syntax
    "B",     # flake8-bugbear: likely bugs, bad patterns
    "A",     # flake8-builtins: avoid shadowing built-ins
    "SIM",   # flake8-simplify: simplify redundant code
    "TID",   # flake8-tidy-imports: disallow relative imports
    "RUF",   # Ruff-specific rules (e.g. `RUF100` for `__all__` sorted)
]
[tool.ruff.lint.isort]
# The generated client is a dependency that happens to be generated into the
# repo root, where ruff would otherwise take it for one of our own packages
# and sort it with them. Declaring it keeps every module agreeing on where
# its import belongs.
known-third-party = ["frikanalen_django_api_client"]

[tool.pytest.ini_options]
# `archive-utils/src` is not a dependency of this package and must never
# become one: it is what runs on the storage host, as the account that owns
# every video. It is on the test path because the SSH archive is now a client
# of it, and the fixture that stands in for file01 runs the real thing -- the
# two agree on a command line, an exit code and a line of JSON, and a double
# here would be free to keep agreeing with an engine that had drifted.
pythonpath = [".", "archive-utils/src"]
# archive-utils/ is a package of its own, with its own pyproject, its own
# tests and no dependency on this one. Without this, a pytest run from the
# repository root collects it too, under a rootdir where its imports do not
# resolve.
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.params.Query"]
