    IngestJob:
      type: object
      description: |-
        What ingest reports about an upload, and what its uploader is shown.

        `status_text` is write-only deliberately: it carries ffmpeg's
        complaints and the archive paths behind them, which belong in the
        admin and the logs rather than in a response to an organization's
        members. What they get instead is `error_code`, which the frontend
        turns into words -- ingest has no business choosing the Norwegian.
      properties:
        video:
          type: integer
          readOnly: true
        state:
          $ref: '#/components/schemas/IngestStateEnum'
        priority:
          type: integer
          maximum: 32767
          minimum: -32768
          description: Claim order among waiting jobs; higher is claimed sooner.
        kind:
          allOf:
          - $ref: '#/components/schemas/IngestKindEnum'
          description: |-
            Where this job's source file is, and therefore which workers can take it.

            * `upload` - Source is a fresh upload in the tusd volume
            * `backfill` - Source is the media archive
        claimedBy:
          type: string
          readOnly: true
          nullable: true
          description: Identity of the worker that last claimed this job, if any.
        percentageDone:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
          description: Progress through the current state, not through the pipeline
            as a whole. Null where the current state has no progress to report.
        errorCode:
          type: string
          description: Machine-readable reason the ingest failed; empty otherwise.
            The wording shown to the uploader is the frontend's to choose, not ingest's.
          maxLength: 64
        updatedTime:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - claimedBy
      - state
      - updatedTime
      - video
    IngestJobRequest:
      type: object
      description: |-
        What ingest reports about an upload, and what its uploader is shown.

        `status_text` is write-only deliberately: it carries ffmpeg's
        complaints and the archive paths behind them, which belong in the
        admin and the logs rather than in a response to an organization's
        members. What they get instead is `error_code`, which the frontend
        turns into words -- ingest has no business choosing the Norwegian.
      properties:
        state:
          $ref: '#/components/schemas/IngestStateEnum'
        priority:
          type: integer
          maximum: 32767
          minimum: -32768
          description: Claim order among waiting jobs; higher is claimed sooner.
        kind:
          allOf:
          - $ref: '#/components/schemas/IngestKindEnum'
          description: |-
            Where this job's source file is, and therefore which workers can take it.

            * `upload` - Source is a fresh upload in the tusd volume
            * `backfill` - Source is the media archive
        percentageDone:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
          description: Progress through the current state, not through the pipeline
            as a whole. Null where the current state has no progress to report.
        statusText:
          type: string
          writeOnly: true
          maxLength: 1000
        errorCode:
          type: string
          description: Machine-readable reason the ingest failed; empty otherwise.
            The wording shown to the uploader is the frontend's to choose, not ingest's.
          maxLength: 64
      required:
      - state
    IngestKindEnum:
      enum:
      - upload
      - backfill
      type: string
      description: |-
        * `upload` - Source is a fresh upload in the tusd volume
        * `backfill` - Source is the media archive
    IngestStateEnum:
      enum:
      - pending
      - probing
      - archiving
      - transcoding
      - done
      - failed
      type: string
      description: |-
        * `pending` - Waiting to be picked up
        * `probing` - Inspecting the uploaded file
        * `archiving` - Storing the original
        * `transcoding` - Generating derived files
        * `done` - Finished
        * `failed` - Failed
