components:
  parameters:
    X-CSRFToken:
      name: X-CSRFToken
      in: header
      required: false
      schema:
        type: string
      description: CSRF token echoed from csrftoken cookie when using SessionAuthentication.
  schemas:
    AsRun:
      type: object
      description: |-
        One entry in the playout log: a video or a named programme, and
        when it went to air.
      properties:
        id:
          type: integer
          readOnly: true
        video:
          type: integer
          nullable: true
          description: Points to the Video which was played if there is one. Can be
            empty if something other than a video was played. The field is mutually
            exclusive with `programName`.
        programName:
          type: string
          description: A free form text input saying what was played. If `video` is
            set, this field should not be set. Examples of where you'd use this field
            is e.g. when broadcasting live. Defaults to the empty string.
          maxLength: 160
        playout:
          type: string
          description: The playout this entry corresponds with. This will almost always
            be 'main' which it defaults to.
          maxLength: 255
        playedAt:
          type: string
          format: date-time
          description: Time when the playout started. Defaults to now.
        inMs:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: The inpoint where the video/stream was started at. In milliseconds.
            Normally 0 which it defaults to.
        outMs:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: The outpoint where the video/stream stopped. This would often
            be the duration of the video, or how long we live streamed a particular
            URL. Can be null (None) if this is 'currently happening'.
      required:
      - id
    AsRunRequest:
      type: object
      description: |-
        One entry in the playout log: a video or a named programme, and
        when it went to air.
      properties:
        video:
          type: integer
          nullable: true
          description: Points to the Video which was played if there is one. Can be
            empty if something other than a video was played. The field is mutually
            exclusive with `programName`.
        programName:
          type: string
          description: A free form text input saying what was played. If `video` is
            set, this field should not be set. Examples of where you'd use this field
            is e.g. when broadcasting live. Defaults to the empty string.
          maxLength: 160
        playout:
          type: string
          description: The playout this entry corresponds with. This will almost always
            be 'main' which it defaults to.
          maxLength: 255
        playedAt:
          type: string
          format: date-time
          description: Time when the playout started. Defaults to now.
        inMs:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: The inpoint where the video/stream was started at. In milliseconds.
            Normally 0 which it defaults to.
        outMs:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: The outpoint where the video/stream stopped. This would often
            be the duration of the video, or how long we live streamed a particular
            URL. Can be null (None) if this is 'currently happening'.
    AsrunCreateError:
      oneOf:
      - $ref: '#/components/schemas/AsrunCreateNonFieldErrorsErrorComponent'
      - $ref: '#/components/schemas/AsrunCreateVideoErrorComponent'
      - $ref: '#/components/schemas/AsrunCreateProgramNameErrorComponent'
      - $ref: '#/components/schemas/AsrunCreatePlayoutErrorComponent'
      - $ref: '#/components/schemas/AsrunCreatePlayedAtErrorComponent'
      - $ref: '#/components/schemas/AsrunCreateInMsErrorComponent'
      - $ref: '#/components/schemas/AsrunCreateOutMsErrorComponent'
      discriminator:
        propertyName: attr
        mapping:
          non_field_errors: '#/components/schemas/AsrunCreateNonFieldErrorsErrorComponent'
          video: '#/components/schemas/AsrunCreateVideoErrorComponent'
          program_name: '#/components/schemas/AsrunCreateProgramNameErrorComponent'
          playout: '#/components/schemas/AsrunCreatePlayoutErrorComponent'
          played_at: '#/components/schemas/AsrunCreatePlayedAtErrorComponent'
          in_ms: '#/components/schemas/AsrunCreateInMsErrorComponent'
          out_ms: '#/components/schemas/AsrunCreateOutMsErrorComponent'
