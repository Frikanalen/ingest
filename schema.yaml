  /api/scheduling/policy:
    get:
      operationId: scheduling_policy_retrieve
      description: |-
        The instants that divide the broadcast schedule into its three states. Every broadcast week runs Monday 00:00 to Monday 00:00, Europe/Oslo, and is drafted two Mondays before it airs, open for member changes for one week, then frozen from the Monday before airing.

        Derive per-item state by comparing `starttime` against these boundaries: before `freezeBoundary` the item is frozen; from `freezeBoundary` up to `schedulingHorizon` it is in the open week, where an item marked `displaceable` can be replaced by a member organization's own pick; beyond `schedulingHorizon` nothing is drafted yet. The values only change on Mondays at midnight Europe/Oslo. Staff accounts are exempt from the freeze. `weeklySlots` describes recurring reserved airtime whether or not its concrete programme has been drafted yet.
