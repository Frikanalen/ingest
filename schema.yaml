  /api/tvanytime/{year}/{month}/{day}:
    get:
      operationId: tvanytime_date_retrieve
      description: |-
        The broadcast schedule as NorDig TV-Anytime metadata (ETSI TS 102 822-3-1, profiled by the NorDig TVA Implementation Guidelines 1.4).

        `ProgramInformationTable` describes each programme once and `ProgramLocationTable` says when it airs, joined by a `crid://` identifier that is stable across requests. Videos we hold online rights for additionally appear as `OnDemandProgram` entries.

        Times are Europe/Oslo. `PublishedStartTime` is what is scheduled; `ActualStartTime` appears only once the airtime has passed, marking the transmission as one we stand behind as having aired.
      summary: Schedule from a given date as TV-Anytime
      parameters:
      - in: path
        name: day
        schema:
          type: string
          pattern: ^\d{2}$
        required: true
      - in: query
        name: days
        schema:
          type: integer
        description: Number of days to cover, 1-31. Defaults to 7.
      - in: path
        name: month
        schema:
          type: string
          pattern: ^\d{2}$
        required: true
      - in: path
        name: year
        schema:
          type: string
          pattern: ^\d{4}$
        required: true
      tags:
      - tvanytime
      security:
      - tokenAuth: []
      - cookieAuth: []
