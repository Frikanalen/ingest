    SchedulingPolicy:
      type: object
      description: |-
        The broadcast-week policy and its recurring reservations.

        Clients should derive per-item state from the boundary instants rather
        than re-implement the week arithmetic (see agenda.scheduling.policy):
        items before freezeBoundary are frozen, items between freezeBoundary
        and schedulingHorizon are in the open week, and airtime beyond
        schedulingHorizon has not been drafted yet. Weekly slots describe
        reserved airtime even when no concrete schedule item has been drafted.
      properties:
        freezeBoundary:
          type: string
          format: date-time
          readOnly: true
          description: 'Schedule items starting before this instant are frozen: member
            organizations can no longer create, move, edit, or delete them. It is
            the Monday midnight (Europe/Oslo) before the open broadcast week, and
            advances one week every Monday at midnight.'
        schedulingHorizon:
          type: string
          format: date-time
          readOnly: true
          description: 'The end of the drafted schedule: the open week runs from freezeBoundary
            to here. The nightly jobs do not schedule beyond this instant, and neither
            should clients present later airtime as available.'
        serverTime:
          type: string
          format: date-time
          readOnly: true
          description: The server's clock when this response was produced. Compare
            against it, not the local clock, when deciding which side of a boundary
            the present moment falls on.
        weeklySlots:
          type: array
          items:
            $ref: '#/components/schemas/WeeklySlotRead'
          readOnly: true
          description: Recurring reservations that the automatic scheduler fills before
            jukebox airtime.
      required:
      - freezeBoundary
      - schedulingHorizon
      - serverTime
      - weeklySlots
