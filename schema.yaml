    PatchedAsRunRequest:
      type: object
      description: |-
        One entry in the playout log: a video or a named programme, and
        when it went to air.
      properties:
        video:
          type: integer
          nullable: true
          description: Points to the Video which was played if there is one. Can be
            empty if something other than a video was played. The field is mutually
            exclusive with `programName`.
        programName:
          type: string
          description: A free form text input saying what was played. If `video` is
            set, this field should not be set. Examples of where you'd use this field
            is e.g. when broadcasting live. Defaults to the empty string.
          maxLength: 160
        playout:
          type: string
          description: The playout this entry corresponds with. This will almost always
            be 'main' which it defaults to.
          maxLength: 255
        playedAt:
          type: string
          format: date-time
          description: Time when the playout started. Defaults to now.
        inMs:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: The inpoint where the video/stream was started at. In milliseconds.
            Normally 0 which it defaults to.
        outMs:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: The outpoint where the video/stream stopped. This would often
            be the duration of the video, or how long we live streamed a particular
            URL. Can be null (None) if this is 'currently happening'.
    PatchedBulletinRequest:
      type: object
      properties:
        heading:
          type: string
          minLength: 1
          maxLength: 80
        text:
          type: string
          minLength: 1
        isPublished:
          type: boolean
    PatchedCategoryRequest:
      type: object
      properties:
        id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        name:
          type: string
          minLength: 1
          maxLength: 255
        desc:
          type: string
          maxLength: 255
    PatchedOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        homepage:
          type: string
          nullable: true
          title: Link back to the organisation home page.
          maxLength: 255
        description:
          type: string
          maxLength: 255
        postalAddress:
          type: string
          nullable: true
          title: Postal address for organization.
          maxLength: 2048
        streetAddress:
          type: string
          nullable: true
          title: Street address for organization.
          maxLength: 2048
    PatchedProgramImageRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
    PatchedScheduleitemModifyRequest:
      type: object
      properties:
        video:
          type: integer
          nullable: true
        schedulereason:
          allOf:
          - $ref: '#/components/schemas/SchedulereasonEnum'
          description: |-
            Staff may choose provenance. Member writes are always recorded as User.

            * `1` - Legacy
            * `2` - Administrative
            * `3` - User
            * `4` - Automatic
            * `5` - Jukebox
        starttime:
          type: string
          format: date-time
        duration:
          type: string
    PatchedSeriesWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        synopsis:
          type: string
          maxLength: 2048
        organization:
          type: integer
    PatchedUserRequest:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 30
        lastName:
          type: string
          maxLength: 30
        dateOfBirth:
          type: string
          format: date
          nullable: true
        phoneNumber:
          type: string
          description: Phone number at which this user can be reached
          maxLength: 128
        password:
          type: string
          writeOnly: true
          minLength: 1
    PatchedVideoFileRequest:
      type: object
      properties:
        video:
          type: integer
        variant:
          $ref: '#/components/schemas/VideoFileVariantEnum'
        filename:
          type: string
          minLength: 1
          maxLength: 256
        integratedLufs:
          type: number
          format: double
          nullable: true
          title: Integrated LUFS of file defined in ITU R.128
        truepeakLufs:
          type: number
          format: double
          nullable: true
          title: True peak LUFS of file defined in ITU R.128
        profileRevision:
          type: integer
          maximum: 32767
          minimum: 0
          description: Revision of the encoding profile that produced this file. 0
            means it predates profile tracking.
    PatchedVideoRequest:
      type: object
      description: 'The read serializer: the organization arrives whole.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        seriesId:
          type: integer
          writeOnly: true
          nullable: true
        episodeNumber:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          description: Episode number within the series. Leave blank when the series
            is unordered.
        duration:
          type: string
        categories:
          type: array
          items:
            type: string
            minLength: 1
        framerate:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Framerate of master video in thousands / second
        properImport:
          type: boolean
          description: Has the video been properly imported?
        hasTonoRecords:
          type: boolean
        publishOnWeb:
          type: boolean
        isFiller:
          type: boolean
          title: Play automatically?
          description: You still have the editorial responsibility.  Only affect videos
            from members.
        refUrl:
          type: string
          description: URL for reference
          maxLength: 1024
        spokenLanguage:
          description: Language tag for the speech in this programme, e.g. 'no', 'nn',
            'se' (Northern Sami) or 'en'. Leave blank if there is no speech.
          oneOf:
          - type: string
            pattern: ^[a-zA-Z]{2,8}(-[a-zA-Z0-9]{1,8})*$
            maxLength: 32
          - type: string
            maxLength: 0
        minimumAge:
          nullable: true
          description: |-
            Norwegian age rating (Medietilsynet's scale). Leave blank when the programme has not been rated -- blank publishes no rating at all, while 'All ages' publishes one.

            * `0` - All ages
            * `6` - 6
            * `9` - 9
            * `12` - 12
            * `15` - 15
            * `18` - 18
          minimum: 0
          maximum: 32767
          oneOf:
          - $ref: '#/components/schemas/MinimumAgeEnum'
          - $ref: '#/components/schemas/NullEnum'
        uploadedTime:
          type: string
          format: date-time
          nullable: true
          description: Time the original video for the program was uploaded
    PatchedWeeklySlotRequest:
      type: object
      properties:
        source:
          type: integer
          nullable: true
          description: Which source picks the video for this slot. Blank means the
            slot reserves airtime that nothing is scheduled into automatically.
    PatchedWeeklySlotSourceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Shown wherever a slot names its source, including the public
            planner.
          maxLength: 100
        type:
          allOf:
          - $ref: '#/components/schemas/WeeklySlotSourceTypeEnum'
          description: |-
            Where the candidate videos come from.

            * `videos` - Hand-picked videos
            * `organization` - Everything one organization has uploaded
        strategy:
          allOf:
          - $ref: '#/components/schemas/StrategyEnum'
          description: |-
            Which candidate airs when a slot using this source comes round.

            * `latest` - The newest upload
            * `random` - A random one
            * `least_scheduled` - The one that has aired the least
        organization:
          type: integer
        directVideos:
          type: array
          items:
            type: integer
