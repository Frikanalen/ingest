{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ingest.uploadFullname" . }}
  labels:
    {{- include "ingest.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: {{ .Values.ingress.certResolver | quote }}
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # Two paths reach the pod, and nothing else does. Ingest's own endpoints
    # are otherwise the tusd hooks and a health check, reached over the pod's
    # loopback -- /tusdHooks in particular is what starts an ingest, so no rule
    # here may be able to reach it.
    #
    # This shares a host with the frontend, which serves /. Traefik prefers the
    # more specific prefix, the same way /graphics and /api already coexist
    # there.
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          {{- if .Values.tusd.enabled }}
          # tusd's own base path, passed through unstripped so tusd sees the
          # URLs it advertises.
          - path: {{ .Values.tusd.basePath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "ingest.uploadFullname" . }}
                port:
                  number: {{ .Values.tusd.port }}
          {{- end }}
          # What the deployed image can build, for whoever is deciding what to
          # queue -- see app/api/formats/routes.py. Exact, not Prefix: this is
          # the only rule pointing at ingest's own HTTP port, and a prefix here
          # would put the rest of the application, hooks included, on the
          # public internet. Keep the path in step with the router's prefix in
          # app/main.py; nothing checks that they agree.
          - path: /ingest-api/formats
            pathType: Exact
            backend:
              service:
                name: {{ include "ingest.uploadFullname" . }}
                port:
                  number: {{ .Values.service.port }}
  tls:
    - hosts:
        - {{ .Values.ingress.hostname | quote }}
{{- end }}
