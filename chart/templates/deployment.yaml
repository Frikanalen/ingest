apiVersion: apps/v1
kind: Deployment
metadata:
  # -upload, because this is the half that owns tusd and the upload volume
  # rather than the whole of ingest -- the worker pool does at least as much
  # ingesting. The Service, Ingress and claim are named from the same helper,
  # so none of them can be left behind describing the old shape.
  #
  # Renaming a Deployment is a delete and a create, and this one owns a
  # ReadWriteOnce volume, so the replacement cannot attach until the old pod
  # has released it. Delete the old `ingest` Deployment and let it finish
  # terminating before upgrading, rather than trusting Helm to order the two.
  # Renaming the claim abandons the old volume with whatever was on it; see
  # the README on upgrading past this.
  name: {{ include "ingest.uploadFullname" . }}
  labels:
    {{- include "ingest.labels" . | nindent 4 }}
    app.kubernetes.io/component: upload
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate: one pod owns the upload volume, and a second
  # pod would either fail to attach it or serve half-finished uploads whose
  # tusd state belongs to its predecessor.
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "ingest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if and .Values.archive.ssh.enabled .Values.archive.ssh.secretChecksum }}
        # The secret is created outside the chart, so Helm cannot see it change.
        # Whoever writes the secret sets this, and the pod rolls on rotation.
        checksum/ssh-secret: {{ .Values.archive.ssh.secretChecksum | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ingest.selectorLabels" . | nindent 8 }}
        # Not in the selector, which stays as it was: a label the Service does
        # not select on can be added and removed freely, and a selector cannot.
        app.kubernetes.io/component: upload
    spec:
      # The SSH credentials are mounted read-only for the group; fsGroup is what
      # lets the unprivileged ingest user read them, and what makes the work and
      # upload volumes writable.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.Version }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "ingest.env" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          livenessProbe:
            httpGet:
              path: /internal/isAlive
              port: http
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /internal/isAlive
              port: http
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.uploads.mountPath }}
            - name: work
              mountPath: {{ .Values.work.mountPath }}
            {{- if .Values.archive.ssh.enabled }}
            - name: archive-ssh
              mountPath: {{ include "ingest.sshMountPath" . }}
              readOnly: true
            {{- end }}
        {{- if .Values.tusd.enabled }}
        - name: tusd
          image: "{{ .Values.tusd.image.repository }}:{{ .Values.tusd.image.tag }}"
          imagePullPolicy: {{ .Values.tusd.image.pullPolicy }}
          args:
            {{- include "ingest.tusdArgs" . | nindent 12 }}
          ports:
            - name: tus
              containerPort: {{ .Values.tusd.port }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: tus
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.tusd.resources | nindent 12 }}
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.uploads.mountPath }}
        {{- end }}
      volumes:
        # Written by tusd, read by ingest. Both mount it at the same path so
        # the paths tusd reports in its hooks are the ones ingest can open.
        - name: uploads
          {{- if .Values.uploads.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.uploads.existingClaim }}
          {{- else if .Values.uploads.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ingest.uploadFullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        # Scratch space for ffmpeg. Derivatives are generated here and uploaded
        # to the archive, so nothing outlives the job that made it.
        - name: work
          emptyDir:
            {{- toYaml .Values.work.emptyDir | nindent 12 }}
        {{- if .Values.archive.ssh.enabled }}
        - name: archive-ssh
          secret:
            secretName: {{ .Values.archive.ssh.secretName }}
            defaultMode: {{ .Values.archive.ssh.defaultMode }}
        {{- end }}
