replicaCount: 1

image:
  repository: ghcr.io/frikanalen/ingest
  pullPolicy: Always
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

api:
  url: https://frikanalen.no
  # Secret holding the Django API token ingest authenticates with. DRF tokens
  # do not expire, so this needs rotating only if it leaks.
  secretName: ingest-api
  tokenKey: token

archive:
  # Where finished files are deposited. With archive.ssh.enabled this is a path
  # on the archive host; otherwise it is a path inside the container, which is
  # only useful for development.
  #
  # Over SSH this is the path ingest *reads* from. Writes name a path relative
  # to whatever root the fk-archive profile on the archive host declares, so
  # this and `root` in /etc/fk-archive-utils/profiles.d/<profile>.toml have to
  # be the same directory. Pointing them at different ones publishes files
  # ingest then cannot find.
  dir: /archive/media

  # How the archive is written: not directly, but by asking `fk-archive` on the
  # storage host over SSH. The account this logs in as has no write access to
  # the archive at all -- see archive-utils/. It is also the switch that selects
  # the deployed archive over a local directory.
  ssh:
    enabled: true
    host: file01
    port: 22
    username: ingest

    # Created outside the chart, by the ingest_archive_account Ansible role, so the
    # private key never passes through Git. Keys must match the role's template.
    secretName: ingest-archive-ssh
    privateKeyKey: id_ed25519
    knownHostsKey: known_hosts

    # Hash of the secret's contents, set by whoever writes the secret. Helm
    # cannot watch a secret it does not own, so this is what rolls the pod when
    # the key is rotated.
    secretChecksum: ""

    # 0440: the secret is mounted root:fsGroup, and ingest reads it as a group
    # member. 0400 would leave it unreadable to an unprivileged container.
    defaultMode: 0440

    # Refuse to start if the credentials are missing rather than quietly
    # archiving into the pod's scratch space, where files are lost on restart.
    required: true

# tusd runs beside ingest in the same pod: it reaches the hook endpoint over
# loopback and shares the upload volume, so uploads never cross a network to
# get to ingest.
tusd:
  enabled: true

  image:
    repository: ghcr.io/tus/tusd
    tag: v2.8.0
    pullPolicy: IfNotPresent

  port: 1080

  # Must match the path in Django's FK_UPLOAD_URL, which is what the frontend
  # is handed as a video's uploadUrl.
  basePath: /upload

  # Behind an ingress, so honour X-Forwarded-* when constructing upload URLs.
  behindProxy: true

  # The frontend uploads with credentials and a CSRF header.
  corsAllowCredentials: true
  corsAllowHeaders: X-CSRFToken
  # Empty leaves tusd's default, which reflects the request origin.
  corsAllowOrigin: ""

  extraArgs: []

  # Small, but not nothing: tusd only shuffles bytes to disk, and starving it
  # stalls uploads that ingest has not even been told about yet.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi

uploads:
  mountPath: /upload

  # Point at a PVC managed elsewhere; otherwise the chart creates its own below.
  existingClaim: ""

  persistence:
    # Off means an emptyDir, which is only sensible for a smoke test:
    # in-progress uploads and anything not yet archived die with the pod.
    enabled: true
    size: 200Gi
    # Empty uses the cluster's default storage class.
    storageClass: ""
    # ReadWriteOnce is enough: one pod, and both containers in it share the
    # mount. Going multi-replica would need RWX and sticky sessions, since a
    # resumed upload must reach the pod holding its partial file.
    accessModes:
      - ReadWriteOnce

work:
  mountPath: /work
  # Holds one video's derivatives at a time. Node disk by default; set
  # sizeLimit to keep a stuck job from filling the node.
  emptyDir:
    sizeLimit: 50Gi

# A second pool of the same image that drains the ingest queue instead of
# serving tusd's hooks. It mounts no upload volume, which is what frees it from
# the single-node constraint the ingest pod has, and it needs no Service or
# ingress because it only ever reaches out.
#
# It is on the member-upload path: the hook archives the original and queues a
# job, and this is what carries that job out. Scaling it to zero stops uploads
# being processed at all.
workers:
  enabled: true

  # Member uploads are drained by this pool, so it must not be zero: a video
  # whose job nobody claims sits at `pending` indefinitely, and nothing in
  # ingest will notice or complain.
  #
  # Three, for the three nodes -- a fixed pool sized to the cluster, until
  # there is a queue-depth metric to scale on. Note that this is a count and
  # not a placement: nothing here says one per node, so the scheduler is free
  # to put two on the same one. Raise it here rather than with `kubectl
  # scale`, which the next `helm upgrade` reverts to whatever this says.
  replicaCount: 3

  # Which queue this pool serves. Every job's source is the archive now -- the
  # hook archives the original before it queues anything -- so this is about
  # who is waiting rather than what the worker can reach. Empty serves both.
  # Set it to `upload` on a second, small pool if you want member uploads in a
  # lane that never queues behind a catalogue-wide re-encode.
  kind: ""

  # How long to wait before asking again when the queue is empty.
  pollIntervalSeconds: 30

  # SIGTERM stops a worker claiming; it still finishes the job it holds. This
  # is how long that is allowed to take. The default 30s is useless here -- a
  # VP9 ladder is hours -- but a long value also means node drains and cluster
  # upgrades wait this long for a worker to finish. An hour is a compromise;
  # raise it if losing an encode to a drain matters more than the wait.
  terminationGracePeriodSeconds: 3600

  # Replace a worker by retiring one first, never by adding one alongside.
  #
  # The default RollingUpdate rounds to maxSurge 1 / maxUnavailable 0 at two
  # replicas, which deadlocks a pool this size: nothing may be terminated
  # until the replacement is Ready, the replacement cannot schedule until the
  # CPU the outgoing worker reserves is released, and because the outgoing
  # worker is never sent SIGTERM it does not release it. The rollout then sits
  # there indefinitely rather than resolving slowly.
  #
  # Surging is the wrong shape here in any case. Workers are fungible and
  # claim their own work, so a replacement adds nothing until the old one has
  # gone -- and an idle worker exits within milliseconds of SIGTERM, so making
  # room first is nearly free whenever the queue is quiet.
  #
  # Two at a time, so a deploy that catches every worker mid-encode is two
  # drains long rather than three. What it costs is capacity during a rollout:
  # one worker is guaranteed, not three. That is the right trade for a queue
  # that waits patiently -- a job nobody is free to claim is claimed a little
  # later, which is not the same kind of problem as an upload path being down.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 2

  # A rollout must be allowed to take as long as draining does. The default is
  # 600s against a grace period of an hour, so any worker that sees out a real
  # encode trips ProgressDeadlineExceeded and reports the app as degraded for
  # no reason. Keep this comfortably above terminationGracePeriodSeconds.
  progressDeadlineSeconds: 4200

  work:
    mountPath: /work
    # Holds one video's original plus its derivatives. Bigger than the ingest
    # pod's, because a backfill fetches the source as well as writing outputs.
    emptyDir:
      sizeLimit: 100Gi

  # Sized for the pool's real duty cycle, which is idle punctuated by bursts.
  #
  # A request is reserved around the clock whether or not there is a job, so
  # asking for what a ladder can use at peak takes replicaCount x that out of
  # the cluster permanently to cover a burst that happens occasionally. It is
  # also what made rollouts fail to schedule.
  #
  # Nothing is given up by asking for less. There is deliberately no
  # limits.cpu -- see the note on the ingest pod's resources below -- so a
  # burst still bursts into every idle core on the node; the request only sets
  # what is guaranteed when the node is contended, and losing that race just
  # makes an encode take longer. If bursts start queueing rather than running
  # slowly, the answer is more workers, not a fatter reservation each.
  resources:
    requests:
      cpu: "2"
      # A ladder's encoder buffers, sized by resolution and not by duration --
      # see the note on the ingest pod's resources below. Nothing a worker
      # holds grows with the length of what it is encoding: ffmpeg's progress
      # stream is parsed and dropped as it arrives rather than accumulated.
      memory: "1Gi"
    limits:
      memory: "4Gi"

  # Require workers to be spread across nodes rather than placing two on one
  # and none on another. Each
  # holds a whole encode's scratch space and saturates what CPU it is given,
  # so stacking them makes them contend for one node's disk and cores while
  # another sits idle.
  #
  # This is a hard constraint: if a node is cordoned, full, or otherwise
  # ineligible, a worker that cannot satisfy maxSkew stays Pending instead of
  # being stacked onto a busier node. Check Pending workers during rollouts and
  # restore node capacity before expecting the rollout to complete.
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

  # Batch work is a reasonable thing to keep off the nodes serving the site.
  nodeSelector: {}
  tolerations: []

  podAnnotations: {}

service:
  type: ClusterIP
  # Ingest's own port: tusd hooks and the health check. Cluster-internal only.
  port: 8000

ingress:
  enabled: true
  className: traefik
  # tusd is served under tusd.basePath on the main site, alongside the
  # frontend at / and the API at /api, rather than on its own subdomain.
  # Django hands this out as a video's uploadUrl, so FK_UPLOAD_URL there must
  # be "<scheme>://<this host><tusd.basePath>".
  hostname: frikanalen.no
  certResolver: letsencrypt
  annotations: {}

# One pod owns the upload volume, so replacements must not overlap.
strategy:
  type: Recreate

# 1000:4203 matches the image, which runs unprivileged. fsGroup makes the work
# volume writable and the mounted SSH key readable.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 4203
  fsGroup: 4203

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

# A pod with neither requests nor limits is BestEffort: it is evicted first
# under node pressure, gets the floor of CPU shares whenever anything else on
# the node wants time, and is invisible to the scheduler, which will happily
# pack more work alongside it. None of that suits an hour-long transcode.
#
# So: requests but no CPU limit. The request is a floor, not a cap -- without
# limits.cpu the pod still bursts into whatever the node has idle, which is
# what you want from a job that is CPU-bound and not latency-sensitive.
#
# Deliberately no limits.cpu. Kubernetes enforces it as CFS quota rather than
# a cpuset, while ffmpeg sizes its thread pools from the node's CPU count --
# it reads sched_getaffinity, which quota does not affect. A 1080p ladder
# opens ~100 threads on a 10-core machine and scales with core count from
# there, so a quota would be burned in a fraction of each scheduling period
# and the cgroup throttled for the rest of it. If you ever do set limits.cpu,
# set an explicit -threads in templates/dash.j2 to match it.
resources:
  requests:
    # Modest on purpose: enough to leave BestEffort and be accounted for by
    # the scheduler, low enough to still place on a small node. Raise it
    # toward the core count a ladder can actually use if the nodes are bigger.
    cpu: "2"
    # One 1080p VP9 ladder measures around 900 MB of encoder buffers, plus the
    # Python process. Roughly resolution-dependent, not duration-dependent:
    # a two-hour upload costs about the same as a two-minute one.
    memory: "1Gi"
  limits:
    # A backstop against a runaway, not a working limit. This pod no longer
    # transcodes -- it archives the original and queues a job, and the workers
    # do the rest -- so the ladder's ~1Gi apiece is their problem now, bounded
    # by their replica count. What is left here is ffprobe and streaming the
    # original up to fk-archive.
    memory: "4Gi"

podAnnotations:
  co.elastic.logs/json.add_error_key: "true"
  co.elastic.logs/json.keys_under_root: "true"
  co.elastic.logs/json.overwrite_keys: "true"

# Extra FK_* settings, as a name/value map.
extraEnv: {}
