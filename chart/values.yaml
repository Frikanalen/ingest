replicaCount: 1

image:
  repository: ghcr.io/frikanalen/ingest
  pullPolicy: Always
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

api:
  url: https://frikanalen.no
  # Secret holding the Django API token ingest authenticates with. DRF tokens
  # do not expire, so this needs rotating only if it leaks.
  secretName: ingest-api
  tokenKey: token

archive:
  # Where finished files are deposited. With archive.ssh.enabled this is a path
  # on the archive host; otherwise it is a path inside the container, which is
  # only useful for development.
  dir: /archive/media

  ssh:
    enabled: true
    host: file01
    port: 22
    username: ingest

    # Created outside the chart, by the ingest_archive_account Ansible role, so the
    # private key never passes through Git. Keys must match the role's template.
    secretName: ingest-archive-ssh
    privateKeyKey: id_ed25519
    knownHostsKey: known_hosts

    # Hash of the secret's contents, set by whoever writes the secret. Helm
    # cannot watch a secret it does not own, so this is what rolls the pod when
    # the key is rotated.
    secretChecksum: ""

    # 0440: the secret is mounted root:fsGroup, and ingest reads it as a group
    # member. 0400 would leave it unreadable to an unprivileged container.
    defaultMode: 0440

    # Refuse to start if the credentials are missing rather than quietly
    # archiving into the pod's scratch space, where files are lost on restart.
    required: true

# tusd runs beside ingest in the same pod: it reaches the hook endpoint over
# loopback and shares the upload volume, so uploads never cross a network to
# get to ingest.
tusd:
  enabled: true

  image:
    repository: ghcr.io/tus/tusd
    tag: v2.8.0
    pullPolicy: IfNotPresent

  port: 1080

  # Must match the path in Django's FK_UPLOAD_URL, which is what the frontend
  # is handed as a video's uploadUrl.
  basePath: /upload

  # Behind an ingress, so honour X-Forwarded-* when constructing upload URLs.
  behindProxy: true

  # The frontend uploads with credentials and a CSRF header.
  corsAllowCredentials: true
  corsAllowHeaders: X-CSRFToken
  # Empty leaves tusd's default, which reflects the request origin.
  corsAllowOrigin: ""

  extraArgs: []

  # Small, but not nothing: tusd only shuffles bytes to disk, and starving it
  # stalls uploads that ingest has not even been told about yet.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi

uploads:
  mountPath: /upload

  # Point at a PVC managed elsewhere; otherwise the chart creates its own below.
  existingClaim: ""

  persistence:
    # Off means an emptyDir, which is only sensible for a smoke test:
    # in-progress uploads and anything not yet archived die with the pod.
    enabled: true
    size: 200Gi
    # Empty uses the cluster's default storage class.
    storageClass: ""
    # ReadWriteOnce is enough: one pod, and both containers in it share the
    # mount. Going multi-replica would need RWX and sticky sessions, since a
    # resumed upload must reach the pod holding its partial file.
    accessModes:
      - ReadWriteOnce

work:
  mountPath: /work
  # Holds one video's derivatives at a time. Node disk by default; set
  # sizeLimit to keep a stuck job from filling the node.
  emptyDir:
    sizeLimit: 50Gi

# A second pool of the same image that drains the ingest queue instead of
# serving tusd's hooks. It mounts no upload volume, which is what frees it from
# the single-node constraint the ingest pod has, and it needs no Service or
# ingress because it only ever reaches out.
workers:
  enabled: true

  # Zero by default: the pool costs nothing at rest, and a backfill is
  # something you start deliberately. `kubectl scale` is the capacity control.
  replicaCount: 0

  # Which queue this pool serves. Every job's source is the archive now -- the
  # hook archives the original before it queues anything -- so this is about
  # who is waiting rather than what the worker can reach. Empty serves both.
  # Set it to `upload` on a second, small pool if you want member uploads in a
  # lane that never queues behind a catalogue-wide re-encode.
  kind: ""

  # How long to wait before asking again when the queue is empty.
  pollIntervalSeconds: 30

  # SIGTERM stops a worker claiming; it still finishes the job it holds. This
  # is how long that is allowed to take. The default 30s is useless here -- a
  # VP9 ladder is hours -- but a long value also means node drains and cluster
  # upgrades wait this long for a worker to finish. An hour is a compromise;
  # raise it if losing an encode to a drain matters more than the wait.
  terminationGracePeriodSeconds: 3600

  work:
    mountPath: /work
    # Holds one video's original plus its derivatives. Bigger than the ingest
    # pod's, because a backfill fetches the source as well as writing outputs.
    emptyDir:
      sizeLimit: 100Gi

  # Pure batch, so ask for real CPU: unlike the ingest pod there is nothing
  # latency-sensitive here to protect, and a worker that gets the floor of CPU
  # shares just makes the backfill take proportionally longer. Still no
  # limits.cpu -- see the note on the ingest pod's resources below.
  resources:
    requests:
      cpu: "4"
      memory: "1Gi"
    limits:
      memory: "4Gi"

  # Batch work is a reasonable thing to keep off the nodes serving the site.
  nodeSelector: {}
  tolerations: []

  podAnnotations: {}

service:
  type: ClusterIP
  # Ingest's own port: tusd hooks and the health check. Cluster-internal only.
  port: 8000

ingress:
  enabled: true
  className: traefik
  # tusd is served under tusd.basePath on the main site, alongside the
  # frontend at / and the API at /api, rather than on its own subdomain.
  # Django hands this out as a video's uploadUrl, so FK_UPLOAD_URL there must
  # be "<scheme>://<this host><tusd.basePath>".
  hostname: frikanalen.no
  certResolver: letsencrypt
  annotations: {}

# One pod owns the upload volume, so replacements must not overlap.
strategy:
  type: Recreate

# 1000:4203 matches the image, which runs unprivileged. fsGroup makes the work
# volume writable and the mounted SSH key readable.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 4203
  fsGroup: 4203

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

# A pod with neither requests nor limits is BestEffort: it is evicted first
# under node pressure, gets the floor of CPU shares whenever anything else on
# the node wants time, and is invisible to the scheduler, which will happily
# pack more work alongside it. None of that suits an hour-long transcode.
#
# So: requests but no CPU limit. The request is a floor, not a cap -- without
# limits.cpu the pod still bursts into whatever the node has idle, which is
# what you want from a job that is CPU-bound and not latency-sensitive.
#
# Deliberately no limits.cpu. Kubernetes enforces it as CFS quota rather than
# a cpuset, while ffmpeg sizes its thread pools from the node's CPU count --
# it reads sched_getaffinity, which quota does not affect. A 1080p ladder
# opens ~100 threads on a 10-core machine and scales with core count from
# there, so a quota would be burned in a fraction of each scheduling period
# and the cgroup throttled for the rest of it. If you ever do set limits.cpu,
# set an explicit -threads in templates/dash.j2 to match it.
resources:
  requests:
    # Modest on purpose: enough to leave BestEffort and be accounted for by
    # the scheduler, low enough to still place on a small node. Raise it
    # toward the core count a ladder can actually use if the nodes are bigger.
    cpu: "2"
    # One 1080p VP9 ladder measures around 900 MB of encoder buffers, plus the
    # Python process. Roughly resolution-dependent, not duration-dependent:
    # a two-hour upload costs about the same as a two-minute one.
    memory: "1Gi"
  limits:
    # A backstop against a runaway, not a working limit. Nothing bounds how
    # many ingests run at once -- tusd fires post-finish per completed upload
    # and each is handled inline -- so this has to cover the concurrency you
    # expect to see, at ~1Gi apiece, or the second simultaneous upload is
    # OOMKilled rather than merely slow.
    memory: "4Gi"

podAnnotations:
  co.elastic.logs/json.add_error_key: "true"
  co.elastic.logs/json.keys_under_root: "true"
  co.elastic.logs/json.overwrite_keys: "true"

# Extra FK_* settings, as a name/value map.
extraEnv: {}
