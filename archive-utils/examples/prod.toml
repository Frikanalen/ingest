# /etc/fk-archive-utils/profiles.d/prod.toml
#
# Which archive `fk-archive prod ...` acts on, and as whom. The profile name
# is the filename, and it is the first argument to every command -- which is
# what lets the sudoers rule pin it. See debian/sudoers.d/fk-archive-utils,
# which the package installs.
#
# Nothing in here is secret: the forced-command wrapper runs as the
# unprivileged ingest account and reads the same file to learn which account
# to sudo to. Keep it root-owned and world-readable.

root = "/archive/media"
manager = "archive-manager"

# Modes applied to everything published. Octal, and as strings: TOML has no
# octal literal, and 0644 written as a number is 644 decimal. The archive is
# exported read-only over NFS to the playout hosts, so both have to leave
# "other" able to read.
file_mode = "0644"
dir_mode = "0755"
